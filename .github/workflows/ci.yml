name: OMO validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict_security:
        description: 'Run release-grade container vulnerability gates'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      strict_security:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: omo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      model: ${{ steps.select.outputs.model }}
      container: ${{ steps.select.outputs.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select expensive validation
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && 'true' || 'false' }}
        run: python src/omo/ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --force-full "$FORCE_FULL" --github-output "$GITHUB_OUTPUT"
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.11'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -m 'not model' -q
      - run: uv run --no-sync python evaluation/dataset.py --validate evaluation/seed.jsonl
      - run: uv run --no-sync python evaluation/heldout.py --validate-cases
      - run: uv run --no-sync python training/dataset.py --split train
      - run: uv run --no-sync python evaluation/dataset.py --validate-outcomes evaluation/outcomes.example.jsonl
      - run: uv run --no-sync python scripts/check_evaluation_contract.py
      - run: uv run --no-sync python scripts/check_training_contract.py
      - run: uv run --no-sync python scripts/check_access_contract.py
      - run: uv run --no-sync python scripts/check_publication_contract.py
      - run: uv run --no-sync python scripts/check_release_contract.py
