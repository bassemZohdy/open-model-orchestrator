name: OMO validation
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: omo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.11'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --build-constraint build-constraints.txt
      - run: uv lock --check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -m 'not model' -q
      - run: uv run --no-sync python evaluation/dataset.py --validate evaluation/seed.jsonl
      - run: uv run --no-sync python training/sft.py --dry-run
      - run: uv run --no-sync python scripts/check_release_contract.py
  native-container:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: bundled
          load: true
          push: false
          tags: omo-test:${{ matrix.arch }}
          cache-from: type=gha,scope=omo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=omo-${{ matrix.arch }}
      - name: Offline native container acceptance
        run: |
          mkdir -p evidence
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 1536m --pids-limit 128 --cpus 4 --tmpfs /tmp:rw,noexec,nosuid,size=16m --entrypoint python omo-test:${{ matrix.arch }} scripts/container_smoke.py | tee evidence/container-${{ matrix.arch }}.txt
          docker image inspect omo-test:${{ matrix.arch }} --format '{{json .}}' > evidence/image-${{ matrix.arch }}.json
          docker save omo-test:${{ matrix.arch }} | gzip -n > /tmp/omo-image.tar.gz
          stat --format='%s' /tmp/omo-image.tar.gz > evidence/docker-save-gzip-bytes-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-evidence-${{ matrix.arch }}
          path: evidence/
          retention-days: 14
