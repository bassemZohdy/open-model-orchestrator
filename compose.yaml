services:
  omo:
    build:
      context: .
      target: bundled
    image: open-model-orchestrator:dev
    init: true
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OMO_HOST: 0.0.0.0
      OMO_API_KEY: ${OMO_API_KEY:?Set a random API key with at least 24 characters}
      OMO_SANDBOX_ENABLED: "true"
      OMO_EXTERNAL_ENABLED: "false"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 4
    pids_limit: 128
    stop_grace_period: 10s
