[project]
name = "open-model-orchestrator"
version = "0.1.0.dev0"
description = "A bounded Python agent with embedded CPU inference and controlled computation"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.52.4",
  "httpx==0.28.1", "PyYAML==6.0.3", "pydantic-monty==0.0.23",
  "llama-cpp-python==0.3.35",
]

[project.scripts]
omo = "omo.__main__:main"
omo-monty-worker = "omo.sandbox_worker:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omo"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.7", "mypy==2.3.1", "types-PyYAML==6.0.12.20260906", "psutil==7.2.2"]
artifacts = ["huggingface-hub==1.31.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["model: real pinned embedded model required", "container: container runtime required"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/omo"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
"evaluation/*" = ["ASYNC240"]
